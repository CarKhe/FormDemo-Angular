<form [formGroup]="formulario" (ngSubmit)="guardar()">
  <app-generic-card title="Registro Usuarios" subtitle="Llena los campos">
        <div card-content>
          <app-generic-input type="text" placeholder="Nombre" controlName="nombre" label="Nombre"/>
          <app-generic-input type="text" placeholder="Correo" controlName="correo" label="Correo"/>
          <app-generic-input type="text" placeholder="Telefono" controlName="telefono" label="Telefono"/>
          <app-generic-select label="Rol" controlName="rol" [options]="roles" displayField="nombre" valueField="id"/>
        </div>
        <div #cardBotones card-botones >
          <app-generic-button label="Guardar" color="warn" type="fab-extended" icon="save"  />  
          <app-generic-button label="Guardar" color="warn" type="fab-extended" icon="save"  />    
        </div>
  </app-generic-card>
</form>
